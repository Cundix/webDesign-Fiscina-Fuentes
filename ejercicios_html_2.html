<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios HTML Parte 2</title>
</head>
<body>
    <table border="1">
        <caption>Copas del Mundo por País</caption>
        <thead>
            <tr>
                <th>País</th>
                <th>Copas</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Argentina</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Brasil</td>
                <td>5</td>
            </tr>
        </tbody>
    </table>

    <hr>

    <form>
        <h3>Login</h3>
        <input type="text" placeholder="Usuario">
        <input type="password" placeholder="Contraseña">
        <button type="submit">Entrar</button>
    </form>

    <hr>

    <form>
        <h3>Registro</h3>
        <input type="text" placeholder="Nombre completo">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Contraseña">
        <button type="submit">Registrarse</button>
    </form>

    <hr>

    <form>
        <h3>Contacto</h3>
        <label>Nombre:</label>
        <input type="text" maxlength="30"><br>
        
        <label>Apellido:</label>
        <input type="text" maxlength="30"><br>
        
        <label>Email:</label>
        <input type="email" required><br>

        <label>Asunto:</label>
        <select>
            <option>Pedir presupuesto</option>
            <option>Solicitar cita previa</option>
            <option>Otros</option>
        </select><br>

        <label>¿Cómo nos conoció?</label><br>
        <input type="checkbox"> Amigo
        <input type="checkbox"> Google
        <input type="checkbox"> Redes Sociales<br>

        <label>Mensaje:</label><br>
        <textarea maxlength="300"></textarea><br>

        <input type="checkbox" required> Acepto términos y condiciones<br>
        
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
