<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios CSS Parte 1</title>
    <style>
        p { color: blue; }

        a {
            color: green;
            text-decoration: none;
        }

        ul.custom-list {
            list-style-image: url('https://via.placeholder.com/10');
        }

        nav ul {
            list-style: none;
            padding: 0;
        }

        nav li {
            display: inline;
            margin-right: 10px;
        }

        .animado {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: transform 0.3s;
        }

        .animado:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <p>Este es un párrafo azul.</p>
    
    <a href="#">Enlace sin subrayado</a>

    <ul class="custom-list">
        <li>Ítem 1</li>
        <li>Ítem 2</li>
    </ul>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <div class="animado"></div>
</body>
</html>
