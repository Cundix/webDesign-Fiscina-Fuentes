<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body>
    <form>
        <h3>Contacto</h3>
        <label>Nombre:</label>
        <input type="text" maxlength="30"><br>
        
        <label>Apellido:</label>
        <input type="text" maxlength="30"><br>
        
        <label>Email:</label>
        <input type="email" required><br>

        <label>Asunto:</label>
        <select>
            <option>Pedir presupuesto</option>
            <option>Solicitar cita previa</option>
            <option>Otros</option>
        </select><br>

        <label>¿Cómo nos conoció?</label><br>
        <input type="checkbox"> Amigo
        <input type="checkbox"> Google
        <input type="checkbox"> Redes Sociales<br>

        <label>Mensaje:</label><br>
        <textarea maxlength="300"></textarea><br>

        <input type="checkbox" required> Acepto términos y condiciones<br>
        
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
